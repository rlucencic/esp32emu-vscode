name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
      # The adapter against esp32emu's demo machine (a CPU and RAM, no ROMs)
      - uses: actions/checkout@v4
        if: runner.os != 'Windows'
        with:
          repository: rlucencic/esp32emu
          path: esp32emu
      - name: The demo machine
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ -d esp32emu/components/emudbg ]; then
            make -C esp32emu/components/emudbg/test
            echo "ESP32EMU_DEMO=$PWD/esp32emu/components/emudbg/test/build/demo" >> "$GITHUB_ENV"
          fi
      - run: npx mocha out/test/integration
        if: runner.os != 'Windows'
      - run: npm run package
        if: runner.os == 'Linux'
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: vsix
          path: '*.vsix'
